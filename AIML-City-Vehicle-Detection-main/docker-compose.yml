version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: netratrack-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: netratrack-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/netratrack
      - PORT=5000
      - JWT_SECRET=netratrack_super_secret_jwt_key_2026
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy

  ml-service:
    build: ./ml-service
    container_name: netratrack-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  client:
    build: ./client
    container_name: netratrack-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
